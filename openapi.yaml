openapi: 3.0.3
info:
  title: Miolingo API
  version: 1.0.0
  description: API for Miolingo Swift clients (iOS + macOS)
servers:
  - url: https://api.miolingo.local/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    User:
      type: object
      properties:
        user_id: { type: integer }
        username: { type: string }
        email: { type: string }
      required: [user_id, username, email]

    AuthTokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
      required: [access_token, refresh_token, expires_in]

    Language:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        levels:
          type: array
          items: { type: string }
      required: [code, name]

    Material:
      type: object
      properties:
        material_id: { type: integer }
        language: { type: string }
        level: { type: string }
        type: { type: string }
        content: { type: string }
        source: { type: string }
      required: [material_id, language, level, type, content]

    PracticeStartRequest:
      type: object
      properties:
        language: { type: string }
        mode: { type: string, description: "words|phrases|stories|custom" }
        level: { type: string }
      required: [language, mode]

    PracticeItem:
      type: object
      properties:
        item_id: { type: integer }
        target_phrase: { type: string }
        translation: { type: string }
        ipa: { type: string }
      required: [item_id, target_phrase]

    PracticeStartResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PracticeItem" }

    PracticeSubmitRequest:
      type: object
      properties:
        item_id: { type: integer }
        recognized_text: { type: string }
        similarity: { type: number }
        phoneme_diff: { type: string }
        duration_ms: { type: integer }
      required: [item_id, recognized_text]

    PracticeSubmitResponse:
      type: object
      properties:
        result_id: { type: integer }
        saved: { type: boolean }
      required: [result_id, saved]

    ProgressEntry:
      type: object
      properties:
        result_id: { type: integer }
        target_phrase: { type: string }
        recognized_text: { type: string }
        similarity: { type: number }
        created_at: { type: string, format: date-time }
      required: [result_id, target_phrase, recognized_text, created_at]

    Settings:
      type: object
      additionalProperties: true

paths:
  /auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
              required: [username, email, password]
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [username, password]
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }

  /auth/logout:
    post:
      summary: Logout (revoke refresh token)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out

  /me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /languages:
    get:
      summary: Supported languages
      responses:
        "200":
          description: Languages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Language" }

  /materials:
    get:
      summary: List materials
      parameters:
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: level
          schema: { type: string }
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }

  /materials/upload:
    post:
      summary: Upload user materials
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                language:
                  type: string
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }

  /practice/start:
    post:
      summary: Start practice session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeStartRequest" }
      responses:
        "200":
          description: Practice items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeStartResponse" }

  /practice/submit:
    post:
      summary: Submit practice result
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeSubmitRequest" }
      responses:
        "200":
          description: Saved result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSubmitResponse" }

  /progress:
    get:
      summary: User progress history
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Progress list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgressEntry" }

  /settings:
    get:
      summary: Get user settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

    put:
      summary: Update user settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
