# Corrective coaching, L1 English -> L2 French (HANDOFF §3). DRAFT by Claude; refused unless reviewed.
pair: {l1: en, l2: fr}
status: draft
reviewed_by: null
reviewed_on: null

ladders:
  "ʁ>english_r":
    status: draft
    contrast:
      manner: >-
        That was an English r: tongue tip raised, lips rounded. French r is made at the BACK of
        the mouth: the back of the tongue comes close to the uvula, the tip stays down behind the
        lower teeth.
    articulation:
      text: >-
        Keep the tongue tip pressed behind your lower front teeth. Say "k" and "g" and feel where
        the back of the tongue touches -- now make a soft, voiced friction just behind that spot,
        like a gentle gargle or the "ch" in Scottish "loch", but voiced. Don't round your lips.
      diagram: null   # licence TBD
    perception:
      minimal_pairs: [[roue, loup], [rang, lent], [rire, lire]]
      task: same_different
      contrast_audio: "native French r vs the learner's own English r (from this attempt)"
    drills:
      - {step: "from [k]/[g] to friction", items: ["aga -> agha", "ka -> kha -> ra"]}
      - {step: "r after voiceless consonants (devoiced)", items: [trois, prendre, cru, fruit]}
      - {step: "r between vowels", items: [Paris, arrêt, héros, tirer]}
      - {step: "word-initial r", items: [rouge, rue, riz, rare]}
      - {step: "word-final r", items: [pour, sur, mer, bonjour]}
    stabilisation:
      phrases: ["la rue rouge", "trois rats", "bonjour Robert"]
      sentences: ["Le rat rond ronge la robe rouge de la reine."]
