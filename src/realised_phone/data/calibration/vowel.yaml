# Vowel detector models -- generated by calibrate_vowel.py; edit there.
calibrated: true
features:
- f1r
- f2r
- f3r
max_formant_hz: 5500.0
# Backness-only vote (see detectors/vowel.py). The four models are all kept: i and ʉ are
# reference only (the 4-way posterior was too weak to vote on CP test, 2026-10-01).
vote:
  features: [f2r]
  groups:
    front: [y, i, ʉ]
    back: [u, uː, ʊ]
provenance:
  script: scripts/realised_phone/calibrate_vowel.py
  date: '2026-10-01'
  caveat: each vowel's tokens come from ONE language's speakers/recordings; cross-language
    contrasts (e.g. French [y] vs English [ʉ]) may partly reflect recording differences
models:
  y:
    mean:
    - 1.0579
    - 1.1534
    - 0.9875
    sd:
    - 0.8251
    - 0.1858
    - 0.1273
    n: 321
    source: 'fr: /opt/cpdata/fr/dev/list.tsv'
  i:
    mean:
    - 0.9737
    - 1.2776
    - 1.1282
    sd:
    - 0.8018
    - 0.2298
    - 0.1265
    n: 797
    source: 'fr: /opt/cpdata/fr/dev/list.tsv'
  u:
    mean:
    - 1.0127
    - 0.7763
    - 0.9969
    sd:
    - 0.473
    - 0.2807
    - 0.164
    n: 189
    source: 'fr: /opt/cpdata/fr/dev/list.tsv'
  ʉ:
    mean:
    - 0.9631
    - 1.0348
    - 0.9956
    sd:
    - 0.517
    - 0.2885
    - 0.133
    n: 202
    source: 'en: /opt/cpdata/en/dev/list.tsv'
