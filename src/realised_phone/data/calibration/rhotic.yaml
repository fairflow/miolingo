# Rhotic detector thresholds (HANDOFF §1b source 3), calibrated on data by
#   scripts/realised_phone/calibrate_rhotic.py  (grid search, balanced accuracy on decided
#   tokens, coverage >= 0.6) on the Common Phone DEV split, then checked on the TEST split.
# Calibrated != approved: the registry entry stays `candidate` until Matthew approves.
calibrated: true
provenance:
  method: "calibrate_rhotic.py grid search on Common Phone dev (HF pklumpp/CommonPhoneDataset,
           CC0): es 400 utts / 136 speakers, en 400 utts / 202 speakers, <=3 utts per speaker;
           labels = MFA canonical phones (es r->trill, ɾ->tap; en ɹ->english_r), codas excluded"
  clips: {tap: 571, trill: 134, english_r: 436}
  dev_result: {balanced_accuracy: 0.664, coverage: 0.680}
  test_check: "research/phonetics/realised_phone/results/rhotics_cp-test-cal-dev.json:
               combined confident accuracy 0.979 at coverage 0.474 (shipped defaults: 0.969 / 0.485)"
  changed_from_defaults: {occlusion.min_depth_db: "5 -> 8", trill.interval_ms: "[25, 75] -> [25, 60]"}
  date: "2026-09-30"

envelope:
  lowpass_hz: 60.0     # envelope smoothing: keeps 13-40 Hz contact rate, drops pitch ripple
  hop_ms: 1.0
  bandpass_hz: [300, 4000]   # voiced energy band; occlusions dip here

occlusion:
  min_depth_db: 8.0          # dip prominence vs surrounding maxima
  max_width_ms: 40.0         # wider than this = stop closure / pause, not a contact
  min_separation_ms: 18.0    # contacts closer than this are merged
  edge_tolerance_ms: 15.0    # count dips this far outside the aligned segment (MFA boundary slop)
  after_stop_ignore_ms: 10.0 # r right after a stop: ignore dips before seg start + 10 ms (the
                             # stop's closure/release). CP dev r-after-stop tokens (0/10/20/30/40 ms):
                             # 10 ms cut English ɹ->"tap" 59->9 and es tap->"trill" 39->9, raised
                             # es tap 118->133; >=20 ms starts erasing real es taps (tres).

trill:
  min_contacts: 2
  interval_ms: [25.0, 60.0]  # 17-40 Hz contact rate accepted

formant:
  max_formant_hz: 5500.0
  f3_ratio_max: 0.78         # segment F3 (20th pct) / utterance median F3 -> "lowered"
  ref_min_frames: 10
  min_low_fraction: 0.5      # share of voiced segment frames that must be lowered (not one glitch)
  min_hf_energy_db: -30.0    # energy >4.1 kHz vs total. Measured: LibriSpeech 16 kHz -9..-14 dB;
                             # MINDS-14 phone audio -37..-48 dB. Below = narrowband, F3 unreliable

uvular:
  # Positive uvular cue (French [ʁ]/[χ]/[ʀ]). Rule chosen on Common Phone DEV (fr [ʁ] 558,
  # en [ɹ] 436, es tap 571 / trill 134 tokens, non-coda) as the best simple rule with <=5%
  # false uvular on tap/trill and <=5% on English r: recall 0.44, FP tap/trill 0.05, FP ɹ 0.01.
  # Caveat: uvular tokens are all French speakers and tap/trill all Spanish -- some separation
  # may be speaker/recording, not phonetics. Test-split check: results/rhotics_cp-*-fr*.json.
  f3_ratio_min: 0.9        # F3 not lowered (English [ɹ] lowers it)
  f2_ratio_max: 0.95       # tongue body backed -> F2 lower than the speaker's median ...
  voiced_max: 0.5          # ... or mostly devoiced ([χ] after voiceless consonants)
  min_duration_ms: 70.0    # taps are short
