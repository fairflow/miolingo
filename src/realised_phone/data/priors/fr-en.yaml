# Research priors: L1 French -> L2 English. DRAFT by Claude for Matthew's review;
# `citation_verified: false` on every entry. Difficulty is qualitative; the Beta mapping is ours.
pair: {l1: fr, l2: en}
status: draft
reviewed_by: null
reviewed_on: null

difficulty_to_prior:
  high:   {alpha: 1.0, beta: 4.0}
  medium: {alpha: 2.5, beta: 2.5}
  low:    {alpha: 4.0, beta: 1.0}

references:
  flege1995: >-
    Flege, J. E. (1995). Second language speech learning: Theory, findings, and problems.
    In W. Strange (Ed.), Speech Perception and Linguistic Experience (pp. 233-277). York Press.
  besttyler2007: >-
    Best, C. T., & Tyler, M. D. (2007). Nonnative and second-language speech perception:
    Commonalities and complementarities. In O.-S. Bohn & M. J. Munro (Eds.), Language
    Experience in Second Language Speech Learning (pp. 13-34). John Benjamins.
  caramazza1973: >-
    Caramazza, A., Yeni-Komshian, G. H., Zurif, E. B., & Carbone, E. (1973). The acquisition of
    a new phonological contrast: The case of stop consonants in French-English bilinguals.
    Journal of the Acoustical Society of America, 54(2), 421-428.

priors:
  ɹ:
    _default:
      difficulty: high
      expected_errors: [uvular]
      why: "French r is uvular; learners map English r onto it."
      refs: [flege1995, besttyler2007]
      citation_verified: false
  θ:
    _default:
      difficulty: high
      expected_errors: [sibilant, stop]
      why: "No dental fricatives in French; typically [s] or [t] (think -> sink/tink)."
      refs: [besttyler2007]
      citation_verified: false
  ð:
    _default:
      difficulty: high
      expected_errors: [sibilant, stop]
      why: "No dental fricatives in French; typically [z] or [d]."
      refs: [besttyler2007]
      citation_verified: false
  h:
    _default:
      difficulty: medium
      expected_errors: [glottal_stop]
      why: "French has no /h/ phoneme; h is often dropped."
      refs: [flege1995]
      citation_verified: false
  pʰ: {_default: {difficulty: medium, expected_errors: [unaspirated], why: "French short-lag VOT carried into English aspirated stops.", refs: [caramazza1973], citation_verified: false}}
  tʰ: {_default: {difficulty: medium, expected_errors: [unaspirated], why: "Short-lag VOT.", refs: [caramazza1973], citation_verified: false}}
  kʰ: {_default: {difficulty: medium, expected_errors: [unaspirated], why: "Short-lag VOT.", refs: [caramazza1973], citation_verified: false}}
  ɪ:
    _default:
      difficulty: high
      expected_errors: [tense]
      why: "French has one high front vowel; ship/sheep merge towards [i]."
      refs: [flege1995]
      citation_verified: false
