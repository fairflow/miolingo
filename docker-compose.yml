version: '3.8'

services:
  miolingo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/fairflow/miolingo:latest
    container_name: miolingo-app
    ports:
      - "8601:8601"
    volumes:
      # Mount secrets from host (required)
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
      # Mount user data directory for persistence
      - ./data/user-data:/app/data/user-data
    environment:
      # Override these in .env file if needed
      - STREAMLIT_SERVER_PORT=8601
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8601/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

