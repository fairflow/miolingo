# Golden clips for realised-phone verdicts (HANDOFF "Next step" 4, beads miolingo-6vo.4).
#
# Levels:
#   detector  -- one labelled token: align `text` with `aligner`, take the `occurrence`-th
#                phone labelled `phone`, run the detector alone, expect `class`.
#   combined  -- same token, detector + recognizer combined (as the pipeline would).
#                Used for English [ɹ] tokens from English speech (a Spanish aligner has no ɹ).
#   pipeline  -- full analyse(): expect verdicts per (word, target).
# Outcomes: pass / abstain (uncertain: allowed) / soft_fail (tentative wrong) / fail
# (confident wrong). Only `fail` fails the run -- accuracy over coverage.
# Paths may use ${ENV} vars. Clips live OUTSIDE the repo (Common Phone on the M4,
# MIO_AUDIO_DUMP_DIR recordings, LibriSpeech via HF). Missing clips are skipped.
# Common Phone clips: extract with scripts/realised_phone/extract_cp_parquet.py (test split,
# es from test-0000{1,2}, en from test-00000) into $MIO_GOLDEN_DIR/cp/<lang>/test/.
#
# Run:  venv/bin/python scripts/realised_phone/run_golden.py [--allow-candidates]
# Still to add: learner recordings (English-L1 Spanish, incl. [ʁ]) from the M4 -- the
# -TODO entries below. No [ʁ] clip exists yet; the detector never asserts uvular.

clips:
  # --- English [ɹ] in English speech (LibriSpeech dummy set, CC-BY-4.0) -------------------
  - id: libri-grave-r
    level: detector
    wav: ${MIO_GOLDEN_DIR}/libri/wb3.wav
    text: "he has grave doubts whether sir frederick leighton's work is really greek after all and can discover in it but little of rocky ithaca"
    aligner: {acoustic_model: english_mfa, dictionary: english_us_mfa}
    detector: rhotic
    phone: ɹ
    occurrence: 1
    class: english_r
  - id: libri-interesting-r
    level: detector
    wav: ${MIO_GOLDEN_DIR}/libri/wb1.wav
    text: "nor is mister quilter's manner less interesting than his matter"
    aligner: {acoustic_model: english_mfa, dictionary: english_us_mfa}
    detector: rhotic
    phone: ɹ
    occurrence: 2
    class: english_r

